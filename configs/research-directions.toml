# ============================================================
# USER EDIT AREA: RESEARCH DIRECTIONS
# Edit THIS file when you want to change topics, materials, or keywords.
# Every [[feeds]] block is one literature stream.
# After committing a change, GitHub Actions automatically runs a fresh_scan
# validation without touching production history.
# ============================================================

# 1) Top-relevance discovery.
# Stock paper-digest 0.4.1 cannot reliably filter by journal name/venue from
# config alone. We therefore prioritize research patterns that are most likely
# to be useful: strong performance improvements, doping optimization and
# transport/mechanism engineering. Venue can then be judged from DOI/article page.
[[feeds]]
name = "TOP RELEVANCE - Performance, Doping and Mechanisms"
source = "openalex"
sort_by = "relevance"
queries = [
  "high thermoelectric performance zT",
  "thermoelectric interface engineering",
  "thermoelectric strain engineering",
  "thermoelectric band engineering",
  "thermoelectric co-doping",
  "thermoelectric carrier optimization",
  "thermoelectric phonon carrier transport",
  "thermoelectric nanostructuring",
  "thermoelectric phase engineering"
]
types = ["article"]
keywords = [
  "thermoelectric performance",
  "thermoelectric figure of merit",
  "zT",
  "power factor",
  "Seebeck coefficient",
  "interface engineering",
  "strain engineering",
  "band engineering",
  "co-doping",
  "carrier concentration"
]
exclude_keywords = [
  "anomalous Nernst effect",
  "spin Nernst",
  "spin caloritronics"
]
max_results = 120
max_items = 12

# 2) Doping optimization and transport physics.
[[feeds]]
name = "PRIORITY - Doping Optimization and Transport"
source = "openalex"
sort_by = "relevance"
queries = [
  "thermoelectric doping optimization",
  "thermoelectric carrier concentration optimization",
  "thermoelectric weighted mobility",
  "thermoelectric quality factor",
  "thermoelectric B factor",
  "thermoelectric band convergence",
  "thermoelectric resonant level",
  "thermoelectric bipolar conduction"
]
types = ["article"]
keywords = [
  "thermoelectric",
  "weighted mobility",
  "quality factor",
  "B factor",
  "carrier concentration",
  "band convergence",
  "power factor",
  "Seebeck coefficient",
  "zT"
]
exclude_keywords = ["spin caloritronics", "anomalous Hall"]
max_results = 100
max_items = 20

