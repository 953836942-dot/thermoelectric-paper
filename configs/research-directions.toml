# ============================================================
# USER EDIT AREA: RESEARCH DIRECTIONS
# Edit THIS file when you want to change topics, materials, or keywords.
# Every [[feeds]] block is one literature stream.
# After committing a change, GitHub Actions automatically runs a fresh_scan
# validation without touching production history.
# ============================================================

# 1) High-priority journal discovery.
# Stock paper-digest has no strict journal/source-name filter, so this feed uses
# Crossref bibliographic queries containing journal names plus thermoelectric terms.
# Treat it as a high-priority discovery stream, not a guaranteed venue filter.
[[feeds]]
name = "HIGH PRIORITY - High-impact Thermoelectrics"
source = "crossref"
sort_by = "relevance"
queries = [
  "thermoelectric Advanced Materials",
  "thermoelectric Advanced Functional Materials",
  "thermoelectric Advanced Energy Materials",
  "thermoelectric Energy Environmental Science",
  "thermoelectric Joule",
  "thermoelectric Matter",
  "thermoelectric ACS Energy Letters",
  "thermoelectric Nature Communications",
  "thermoelectric Science Advances",
  "thermoelectric Nano Energy",
  "thermoelectric Chemistry of Materials",
  "thermoelectric Acta Materialia",
  "thermoelectric Scripta Materialia",
  "thermoelectric Small",
  "thermoelectric Journal of Materials Chemistry A"
]
types = ["journal-article"]
keywords = [
  "thermoelectric",
  "Seebeck coefficient",
  "power factor",
  "figure of merit",
  "zT"
]
exclude_keywords = [
  "anomalous Nernst effect",
  "spin Nernst",
  "spin caloritronics"
]
max_results = 80
max_items = 20

# 2) Doping optimization and transport physics.
[[feeds]]
name = "PRIORITY - Doping Optimization and Transport"
source = "openalex"
sort_by = "relevance"
queries = [
  "thermoelectric doping optimization",
  "thermoelectric carrier concentration optimization",
  "thermoelectric weighted mobility",
  "thermoelectric quality factor",
  "thermoelectric B factor",
  "thermoelectric band convergence",
  "thermoelectric resonant level",
  "thermoelectric bipolar conduction"
]
types = ["article"]
keywords = [
  "thermoelectric",
  "weighted mobility",
  "quality factor",
  "B factor",
  "carrier concentration",
  "band convergence",
  "power factor",
  "Seebeck coefficient",
  "zT"
]
exclude_keywords = ["spin caloritronics", "anomalous Hall"]
max_results = 100
max_items = 20

