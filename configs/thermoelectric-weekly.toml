[app]
timezone = "Australia/Brisbane"
lookback_hours = 168
output_dir = "output"
request_delay_seconds = 3
request_timeout_seconds = 60
fetch_retry_attempts = 4
fetch_retry_backoff_seconds = 10

[state]
enabled = true
path = ".paper-digest-state/state.json"
retention_days = 180

[feedback]
enabled = true
path = ".paper-digest-state/feedback.json"
star_boost = 80
follow_up_boost = 35
reading_boost = 18
done_penalty = 20
ignore_penalty = 120
hide_ignored = true

[notify]
feedback_only = false
include_new_starred = true
include_follow_up_resurfaced = true
include_starred_momentum = true
max_focus_items = 5
max_action_items = 5
action_overdue_only = false

[digest]
template = "default"
top_highlights = 5
feed_key_points = 4

[ranking]
sort_by = "hybrid"
title_match_weight = 48
summary_match_weight = 16
doi_weight = 12
pdf_weight = 8
rich_summary_weight = 6
metadata_weight = 4
multi_source_weight = 12
freshness_weight_cap = 24

[analysis]
enabled = false
provider = "openai"
model = "gpt-5-mini"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1/responses"
timeout_seconds = 60
max_papers = 8
max_output_tokens = 600
language = "English"
reasoning_effort = "minimal"
fail_on_error = false

[translation]
enabled = false
provider = "argos"
model_path = ".paper-digest-models/argos-en-zh-1.9"
max_papers = 24
max_summary_chars = 600
fail_on_error = false

# High-precision conventional thermoelectric materials feed.
[[feeds]]
name = "Core Thermoelectric Materials"
source = "arxiv"
categories = ["cond-mat.mtrl-sci", "physics.app-ph"]
keywords = [
  "thermoelectric material",
  "thermoelectric materials",
  "thermoelectric performance",
  "thermoelectric properties",
  "thermoelectric figure of merit",
  "Seebeck coefficient",
  "thermoelectric power factor",
  "zT"
]
exclude_keywords = [
  "anomalous Nernst effect",
  "spin Nernst",
  "spin caloritronics"
]
max_results = 160
max_items = 30

# Doping, carrier transport, and the physics most useful for composition optimization.
[[feeds]]
name = "Doping and Transport"
source = "arxiv"
categories = ["cond-mat.mtrl-sci", "physics.app-ph"]
keywords = [
  "thermoelectric doping",
  "doped thermoelectric",
  "carrier concentration optimization",
  "thermoelectric band convergence",
  "resonant level thermoelectric",
  "weighted mobility",
  "thermoelectric quality factor",
  "bipolar conduction"
]
exclude_keywords = [
  "spin caloritronics",
  "anomalous Hall"
]
max_results = 160
max_items = 30

# Machine learning and data-driven thermoelectric discovery.
[[feeds]]
name = "Thermoelectric ML and Discovery"
source = "arxiv"
categories = ["cond-mat.mtrl-sci", "physics.app-ph", "cs.LG"]
keywords = [
  "machine learning thermoelectric",
  "thermoelectric machine learning",
  "data-driven thermoelectric",
  "thermoelectric materials informatics",
  "thermoelectric screening",
  "thermoelectric prediction"
]
exclude_keywords = ["tutorial"]
max_results = 180
max_items = 25

# Flexible, printed, wearable, and module/device work.
[[feeds]]
name = "Flexible and Thermoelectric Devices"
source = "arxiv"
categories = ["cond-mat.mtrl-sci", "physics.app-ph"]
keywords = [
  "flexible thermoelectric",
  "wearable thermoelectric",
  "printed thermoelectric",
  "thermoelectric generator",
  "thermoelectric module",
  "thermoelectric device"
]
exclude_keywords = []
max_results = 160
max_items = 25

# Journal-oriented coverage beyond arXiv.
[[feeds]]
name = "Thermoelectric Journals - Crossref"
source = "crossref"
queries = [
  "thermoelectric materials",
  "thermoelectric doping",
  "thermoelectric machine learning"
]
types = ["journal-article", "proceedings-article"]
keywords = [
  "thermoelectric",
  "Seebeck coefficient",
  "thermoelectric power factor",
  "thermoelectric figure of merit"
]
exclude_keywords = [
  "anomalous Nernst effect",
  "spin Nernst"
]
max_results = 120
max_items = 35

# OpenAlex is restricted to article records; preprints are already covered by
# arXiv, and excluding OpenAlex preprints avoids duplicate repository deposits.
[[feeds]]
name = "Thermoelectric Journals - OpenAlex"
source = "openalex"
queries = [
  "thermoelectric materials",
  "thermoelectric doping",
  "thermoelectric machine learning"
]
types = ["article"]
keywords = [
  "thermoelectric",
  "Seebeck coefficient",
  "thermoelectric power factor",
  "thermoelectric figure of merit"
]
exclude_keywords = [
  "anomalous Nernst effect",
  "spin Nernst"
]
max_results = 120
max_items = 35

