name: Temporary ESTM export
on:
  push:
    branches: [tmp-estm-export-20260901]
    paths: ['.github/workflows/tmp_estm_export.yml']
permissions:
  contents: write
jobs:
  inspect-starry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-estm-export-20260901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas
      - name: Inspect current Starry TE files
        run: |
          python - <<'PY'
          import pandas as pd
          base='https://github.com/starrydata/starrydata_datasets/releases/latest/download'
          for kind in ['curves','samples','papers']:
              u=f'{base}/ThermoelectricMaterials_{kind}.csv.gz'
              d=pd.read_csv(u,compression='gzip',nrows=20)
              with open(f'tmp_estm_export/starry_{kind}_head.txt','w') as f:
                  f.write('COLUMNS\n'+repr(d.columns.tolist())+'\n\nHEAD\n'+d.to_string(index=False))
              print(kind,d.columns.tolist())
          PY
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp_estm_export/starry_*_head.txt
          git commit -m 'Inspect current Starry TE schema' || exit 0
          git push origin HEAD:tmp-estm-export-20260901
