name: Thermoelectric Paper Digest Weekly

on:
  schedule:
    # Brisbane is UTC+10 year-round: Sunday 22:07 UTC = Monday 08:07 AEST.
    - cron: "7 22 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "configs/thermoelectric-weekly.toml"
      - ".github/workflows/thermoelectric-weekly.yml"

permissions:
  contents: read

concurrency:
  group: thermoelectric-paper-digest-weekly
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v5
        with:
          path: control

      - name: Checkout pristine upstream paper-digest
        uses: actions/checkout@v5
        with:
          repository: X-PG13/paper-digest
          ref: 8906f9a12309956913eab29dade75c01cb7d0771
          path: paper-digest

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install stock paper-digest
        run: python -m pip install ./paper-digest

      - name: Materialize production config
        run: cp control/configs/thermoelectric-weekly.toml paper-digest/config.toml

      # Scheduled and manual production runs keep state/history. Push-triggered
      # config validation is intentionally stateless so keyword changes can be
      # evaluated against the full current lookback window without polluting
      # production deduplication state.
      - name: Restore digest state
        if: ${{ github.event_name != 'push' }}
        id: state-restore
        uses: actions/cache/restore@v5
        with:
          path: paper-digest/.paper-digest-state
          key: thermoelectric-paper-digest-state-${{ github.run_id }}
          restore-keys: |
            thermoelectric-paper-digest-state-

      - name: Restore archive history
        if: ${{ github.event_name != 'push' }}
        id: output-restore
        uses: actions/cache/restore@v5
        with:
          path: paper-digest/output
          key: thermoelectric-paper-digest-output-${{ github.run_id }}
          restore-keys: |
            thermoelectric-paper-digest-output-

      - name: Run weekly digest
        working-directory: paper-digest
        run: python -m paper_digest --config config.toml

      - name: Verify stock outputs
        working-directory: paper-digest
        run: |
          test -s output/latest.json
          test -s output/latest.md
          test -s output/site/index.html
          python - <<'PY'
          import json
          from pathlib import Path

          latest_json = Path("output/latest.json")
          latest_md = Path("output/latest.md")
          site_index = Path("output/site/index.html")
          payload = json.loads(latest_json.read_text(encoding="utf-8"))

          print("VERIFY_OK=1")
          print("LATEST_JSON_TYPE=" + type(payload).__name__)
          print("LATEST_JSON_BYTES=" + str(latest_json.stat().st_size))
          print("LATEST_MD_BYTES=" + str(latest_md.stat().st_size))
          print("SITE_INDEX_BYTES=" + str(site_index.stat().st_size))
          PY

      - name: Upload weekly digest artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thermoelectric-paper-digest-weekly-${{ github.run_number }}
          path: paper-digest/output/
          if-no-files-found: warn
          retention-days: 90

      - name: Save digest state
        if: ${{ github.event_name != 'push' && always() && hashFiles('paper-digest/.paper-digest-state/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: paper-digest/.paper-digest-state
          key: thermoelectric-paper-digest-state-${{ github.run_id }}

      - name: Save archive history
        if: ${{ github.event_name != 'push' && success() && hashFiles('paper-digest/output/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: paper-digest/output
          key: thermoelectric-paper-digest-output-${{ github.run_id }}
