name: Literature Monitor App CI

on:
  push:
    branches: [literature-monitor-app]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "packages/**"
      - "apps/**"
      - ".github/workflows/literature-monitor-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test -- packages/literature-core/tests
      - run: npm --workspace apps/worker test
      - run: npm --workspace apps/extension test
      - run: npm run typecheck
      - name: Wrangler dry-run bundle
        run: npm --workspace apps/worker exec -- wrangler deploy --dry-run --outdir /tmp/literature-worker-dist
